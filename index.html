<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Board Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b5cf6">
</head>
<body>

  <!-- Üst Bar / Header -->
  <header class="top-bar glass-card">
    <div class="brand">
      <h1 id="welcome-text">Hoş geldin, Kral!</h1>
      <span class="subtitle">Studio Edition V2</span>
    </div>
    <button id="open-settings-btn" class="icon-btn">⚙️ Stüdyo Ayarları</button>
  </header>

  <!-- Ana Panel (Sürüklenip Sıralanabilir Kartlar Container'ı) -->
  <main class="dashboard-grid" id="dashboard-grid">

    <!-- Kart 1: Sound Mixer (Ses Stüdyosu) -->
    <section class="glass-card draggable-card" draggable="true" id="card-sound-mixer">
      <div class="card-header">
        <h3>🎧 Ambient Sound Mixer</h3>
        <span class="drag-handle">⋮⋮</span>
      </div>
      <div class="card-body">
        <div class="mixer-track">
          <label>🌧️ Yağmur Sesi</label>
          <input type="range" class="sound-slider" data-sound="rain" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="mixer-track">
          <label>☕ Cafe Ambiyansı</label>
          <input type="range" class="sound-slider" data-sound="cafe" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="mixer-track">
          <label>🔥 Şömine Ateşi</label>
          <input type="range" class="sound-slider" data-sound="fire" min="0" max="1" step="0.01" value="0">
        </div>
        <button id="toggle-all-audio" class="primary-btn full-btn">Tüm Sesleri Durdur</button>
      </div>
    </section>

    <!-- Kart 2: Stüdyo Lirik & Fikir Defteri -->
    <section class="glass-card draggable-card" draggable="true" id="card-notes">
      <div class="card-header">
        <h3>📝 Studio Notes & Lyric Book</h3>
        <span class="drag-handle">⋮⋮</span>
      </div>
      <div class="card-body">
        <textarea id="studio-notes" placeholder="Aklına gelen rap liriklerini, proje fikirlerini buraya yaz..."></textarea>
        <button id="save-notes-btn" class="primary-btn full-btn">Hafızaya Kaydet</button>
      </div>
    </section>

    <!-- Kart 3: Hızlı Odaklanma Kronometresi -->
    <section class="glass-card draggable-card" draggable="true" id="card-timer">
      <div class="card-header">
        <h3>⏱️ Focus Studio Timer</h3>
        <span class="drag-handle">⋮⋮</span>
      </div>
      <div class="card-body timer-body">
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="start-timer" class="primary-btn">Başlat</button>
          <button id="pause-timer" class="secondary-btn">Durdur</button>
          <button id="reset-timer" class="secondary-btn">Sıfırla</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Stüdyo & Profil Ayarları Modalı -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h2>⚙️ Stüdyo & Profil Ayarları</h2>
        <button id="close-settings" class="icon-btn">&times;</button>
      </div>
      
      <div class="modal-body">
        <div class="setting-group">
          <label for="user-name-input">Kullanıcı / Sahne Adı:</label>
          <input type="text" id="user-name-input" placeholder="Adını yaz..." class="custom-input">
        </div>

        <div class="setting-group">
          <label>Vurgu Rengi (Accent Color):</label>
          <div class="color-options">
            <button class="color-btn" data-color="#8b5cf6" style="background: #8b5cf6;"></button>
            <button class="color-btn" data-color="#06b6d4" style="background: #06b6d4;"></button>
            <button class="color-btn" data-color="#10b981" style="background: #10b981;"></button>
            <button class="color-btn" data-color="#f43f5e" style="background: #f43f5e;"></button>
            <button class="color-btn" data-color="#f59e0b" style="background: #f59e0b;"></button>
          </div>
        </div>

        <div class="setting-group">
          <label for="blur-range">Cam Şeffaflığı (Blur): <span id="blur-val">12px</span></label>
          <input type="range" id="blur-range" min="0" max="25" value="12" class="custom-slider">
        </div>
      </div>

      <button id="save-settings-btn" class="primary-btn full-btn">Değişiklikleri Kaydet</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
